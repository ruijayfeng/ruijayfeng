name: Build README

on:
  schedule:
    - cron: "30 6 * * *"  # daily, staggered from the blog workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update latest releases section
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build_readme.py
      - name: Commit and push if changed
        run: |-
          git diff --quiet README.md && exit 0
          git config user.name "readme-bot"
          git config user.email "readme-bot@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest releases [skip ci]"
          git push
