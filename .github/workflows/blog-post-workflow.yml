name: Latest blog post workflow
on:
  schedule:
    - cron: '0 6 * * *'  # daily, staggered from build.yml
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          # 自建博客上线后，把下面换成 fengzhe.site 的 RSS 地址即可
          feed_list: "https://rss.csdn.net/SDFsoul/rss/map"
          max_item_count: 6
          commit_message: "chore: refresh writing column [skip ci]"
          committer_branch: main
